# The CI of the LogNorth TypeScript SDK: the type check, the tests and
# gitleaks, then one required check, test. Its name must stay "CI":
# merge-security-updates.yml waits for a workflow of that name.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@main

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [tests, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
